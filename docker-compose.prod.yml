services:
  # ============================================================================
  # Reverse Proxy & SSL Termination (Caddy)
  # ============================================================================
  caddy:
    image: caddy:2.8-alpine
    container_name: flopkart-caddy
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@flopkart.com}
    depends_on:
      - api-gateway
    networks:
      - flopkart-network

  # ============================================================================
  # Infrastructure Services
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: flopkart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-flopkart_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    networks:
      - flopkart-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: flopkart-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - flopkart-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: flopkart-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "4L622nShTUiBenYh_semester"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - flopkart-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 29092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ============================================================================
  # Discovery & Gateway Services (GHCR Images)
  # ============================================================================
  eureka-server:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-nachikethakg}/flopkart-eureka-server:${IMAGE_TAG:-latest}
    container_name: flopkart-eureka-server
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - flopkart-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  api-gateway:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-nachikethakg}/flopkart-api-gateway:${IMAGE_TAG:-latest}
    container_name: flopkart-api-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - flopkart-network

  # ============================================================================
  # Domain Microservices (GHCR Images)
  # ============================================================================
  user-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-nachikethakg}/flopkart-user-service:${IMAGE_TAG:-latest}
    container_name: flopkart-user-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/flopkart_user_db
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - flopkart-network

  product-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-nachikethakg}/flopkart-product-service:${IMAGE_TAG:-latest}
    container_name: flopkart-product-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/flopkart_product_db
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - flopkart-network

  cart-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-nachikethakg}/flopkart-cart-service:${IMAGE_TAG:-latest}
    container_name: flopkart-cart-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on:
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - flopkart-network

  order-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-nachikethakg}/flopkart-order-service:${IMAGE_TAG:-latest}
    container_name: flopkart-order-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/flopkart_order_db
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - flopkart-network

  payment-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-nachikethakg}/flopkart-payment-service:${IMAGE_TAG:-latest}
    container_name: flopkart-payment-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/flopkart_payment_db
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PAYMENT_SIMULATE_FAILURE: ${PAYMENT_SIMULATE_FAILURE:-false}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - flopkart-network

  notification-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-nachikethakg}/flopkart-notification-service:${IMAGE_TAG:-latest}
    container_name: flopkart-notification-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on:
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - flopkart-network

# ==============================================================================
# Persistent Named Volumes & Network Configuration
# ==============================================================================
networks:
  flopkart-network:
    name: flopkart-prod-network
    driver: bridge

volumes:
  postgres_data:
    name: flopkart_prod_postgres_data
  redis_data:
    name: flopkart_prod_redis_data
  kafka_data:
    name: flopkart_prod_kafka_data
  caddy_data:
    name: flopkart_prod_caddy_data
  caddy_config:
    name: flopkart_prod_caddy_config
