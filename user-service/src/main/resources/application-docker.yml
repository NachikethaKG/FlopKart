spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/flopkart_user_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}
  instance:
    prefer-ip-address: true
